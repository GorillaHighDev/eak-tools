<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EAK Style Lookup</title>
<script src="./msal-browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0D0D0F; --panel:#17171B; --paper:#F2F0EB; --concrete:#8C897F;
  --gold:#D9A22E; --bred:#C3251C; --line:rgba(242,240,235,.12); --good:#3FB56F; --warn:#E8A13B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ink);color:var(--paper);font-family:'Space Grotesk',sans-serif;
  -webkit-font-smoothing:antialiased}
.display{font-family:'Anton',sans-serif;text-transform:uppercase}
.mono{font-family:'IBM Plex Mono',monospace}

header{padding:18px 5vw 14px;border-bottom:1px solid var(--line);text-align:center;position:relative}
#home-link{position:absolute;left:5vw;top:18px;color:var(--concrete);
  font-family:'IBM Plex Mono',monospace;font-size:.72rem;text-decoration:none;letter-spacing:.02em}
#home-link:active{color:var(--gold)}
header h1{font-size:1.25rem;color:#fff;margin:0 0 4px}
header .mono{font-size:.65rem;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}

#onedrive-bar{
  max-width:520px;margin:0 auto;padding:10px 5vw;display:flex;align-items:center;
  justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);
  background:var(--panel);flex-wrap:wrap;
}
#onedrive-status{font-size:.68rem;color:var(--concrete);letter-spacing:.02em}
#onedrive-status.connected{color:var(--good)}
#onedrive-status.warn{color:var(--warn)}
#onedrive-bar button{
  background:none;border:1px solid var(--gold);color:var(--gold);border-radius:5px;
  padding:6px 12px;font-family:'IBM Plex Mono',monospace;font-size:.68rem;
  letter-spacing:.04em;text-transform:uppercase;cursor:pointer;
}
#onedrive-disconnect-btn{border-color:var(--line);color:var(--concrete)}

main{max-width:520px;margin:0 auto;padding:24px 5vw 12vh}

.field{position:relative;margin-bottom:18px}
.field label{
  display:block;font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--gold);margin-bottom:6px;
}
.field input{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:12px 14px;color:#fff;font-family:'Space Grotesk',sans-serif;font-size:1rem;
}
.field input:disabled{opacity:.4}
.field input:focus{outline:none;border-color:var(--gold)}

.suggestions{
  position:absolute;top:100%;left:0;right:0;background:var(--panel);
  border:1px solid var(--gold);border-top:none;border-radius:0 0 6px 6px;
  max-height:220px;overflow-y:auto;z-index:10;display:none;
}
.suggestions.show{display:block}
.suggestion-item{
  padding:11px 14px;font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:#fff;
  cursor:pointer;border-bottom:1px solid var(--line);
}
.suggestion-item:last-child{border-bottom:none}
.suggestion-item:active{background:var(--ink)}
.suggestion-empty{padding:11px 14px;font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--concrete)}

#results{display:none}
#results.show{display:block}
.result-header{text-align:center;margin-bottom:16px}
.result-brand{font-family:'Anton',sans-serif;font-size:1.4rem;color:#fff;text-transform:uppercase}
.result-notes{font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--gold);margin-top:2px}

#result-photos{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.photo-thumb{width:84px;height:84px}
.photo-thumb img{
  width:84px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line);
  background:var(--panel);display:block;cursor:pointer;
}
#photos-empty{text-align:center;color:var(--concrete);font-size:.78rem;margin-bottom:20px;
  font-family:'IBM Plex Mono',monospace}

#size-list{display:grid;grid-template-columns:auto 1fr auto;column-gap:10px}
.size-row-display > *{
  padding:8px 4px;font-family:'IBM Plex Mono',monospace;font-size:.82rem;
  border-bottom:1px solid var(--line);text-align:left;
}
.size-row-bc{color:var(--concrete);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34vw}
.size-row-size{color:#fff}
.size-row-qty{color:var(--concrete);text-align:right}

#empty-state{text-align:center;color:var(--concrete);font-size:.85rem;padding:40px 20px}

#photo-lightbox{
  display:none;position:fixed;inset:0;background:rgba(13,13,15,.92);z-index:100;
  align-items:center;justify-content:center;padding:5vw;
}
#photo-lightbox.show{display:flex}
#photo-lightbox img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain}
</style>
</head>
<body>

<header>
  <a id="home-link" href="./index.html">← All Tools</a>
  <h1 class="display">Exclusive Style Lookup</h1>
  <span class="mono">Search by brand + style, get every size</span>
</header>

<div id="onedrive-bar">
  <span id="onedrive-status" class="mono">☁ Checking OneDrive…</span>
  <button id="onedrive-connect-btn" type="button" style="display:none">Connect OneDrive</button>
  <button id="onedrive-disconnect-btn" type="button" style="display:none">Disconnect</button>
</div>

<main>
  <div class="field">
    <label>Brand</label>
    <input type="text" id="brand-input" autocomplete="off" placeholder="Start typing a brand…">
    <div class="suggestions" id="brand-suggestions"></div>
  </div>

  <div class="field">
    <label>Style / Notes</label>
    <input type="text" id="notes-input" autocomplete="off" placeholder="Pick a brand first…" disabled>
    <div class="suggestions" id="notes-suggestions"></div>
  </div>

  <div id="results">
    <div class="result-header">
      <div class="result-brand" id="result-brand"></div>
      <div class="result-notes" id="result-notes"></div>
    </div>
    <div id="result-photos"></div>
    <div id="photos-empty" style="display:none">No photos on file for this style yet.</div>
    <div id="size-list"></div>
  </div>

  <div id="empty-state">Connect OneDrive, then start typing a brand above.</div>
</main>

<div id="photo-lightbox">
  <img id="lightbox-img" src="" alt="">
</div>

<script>
// ---- OneDrive sync (Microsoft Graph API) — same setup as the other tools ----
const GRAPH_SCOPES = ['Files.ReadWrite', 'offline_access', 'User.Read'];
const msalConfig = {
  auth: {
    clientId: '12101a8e-26f6-4965-85fe-3d762062e8ca',
    authority: 'https://login.microsoftonline.com/common',
    redirectUri: window.location.origin + window.location.pathname,
  },
  cache: { cacheLocation: 'localStorage' },
};
const msalInstance = new msal.PublicClientApplication(msalConfig);

const odStatus = document.getElementById('onedrive-status');
const odConnectBtn = document.getElementById('onedrive-connect-btn');
const odDisconnectBtn = document.getElementById('onedrive-disconnect-btn');
const brandInput = document.getElementById('brand-input');
const notesInput = document.getElementById('notes-input');
const brandSuggestions = document.getElementById('brand-suggestions');
const notesSuggestions = document.getElementById('notes-suggestions');
const resultsEl = document.getElementById('results');
const resultBrand = document.getElementById('result-brand');
const resultNotes = document.getElementById('result-notes');
const resultPhotos = document.getElementById('result-photos');
const photosEmpty = document.getElementById('photos-empty');
const sizeListEl = document.getElementById('size-list');
const emptyStateEl = document.getElementById('empty-state');
const photoLightbox = document.getElementById('photo-lightbox');
const lightboxImg = document.getElementById('lightbox-img');

function updateOneDriveUI() {
  const account = msalInstance.getActiveAccount();
  if (account) {
    odStatus.textContent = `☁ Connected — ${account.username}`;
    odStatus.classList.add('connected');
    odStatus.classList.remove('warn');
    odConnectBtn.style.display = 'none';
    odDisconnectBtn.style.display = 'inline-block';
    loadAllItems();
  } else {
    odStatus.textContent = '☁ Not connected — connect to search';
    odStatus.classList.remove('connected');
    odStatus.classList.add('warn');
    odConnectBtn.style.display = 'inline-block';
    odDisconnectBtn.style.display = 'none';
  }
}

odConnectBtn.addEventListener('click', () => {
  msalInstance.loginRedirect({ scopes: GRAPH_SCOPES });
});
odDisconnectBtn.addEventListener('click', () => {
  msalInstance.setActiveAccount(null);
  updateOneDriveUI();
});

async function getGraphToken() {
  const account = msalInstance.getActiveAccount();
  if (!account) return null;
  try {
    const result = await msalInstance.acquireTokenSilent({ scopes: GRAPH_SCOPES, account });
    return result.accessToken;
  } catch (err) {
    await msalInstance.acquireTokenRedirect({ scopes: GRAPH_SCOPES });
    return null;
  }
}

function encodeGraphPath(path) {
  return path.split('/').map(encodeURIComponent).join('/');
}

async function downloadOneDriveFileWithStatus(relativePath) {
  const token = await getGraphToken();
  if (!token) return { status: 'error' };
  try {
    const url = `https://graph.microsoft.com/v1.0/me/drive/root:/EAK-Sync/${encodeGraphPath(relativePath)}:/content`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    if (res.status === 404) return { status: 'notfound' };
    if (!res.ok) return { status: 'error' };
    const text = await res.text();
    return { status: 'ok', text };
  } catch (err) {
    console.warn('OneDrive download failed:', relativePath, err);
    return { status: 'error' };
  }
}

async function listOneDriveFiles(folderPath) {
  const token = await getGraphToken();
  if (!token) return null;
  try {
    const url = `https://graph.microsoft.com/v1.0/me/drive/root:/EAK-Sync/${encodeGraphPath(folderPath)}:/children`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) return null;
    const data = await res.json();
    return data.value || [];
  } catch (err) {
    console.warn('OneDrive list failed:', folderPath, err);
    return null;
  }
}

async function downloadOneDriveFileBlob(relativePath) {
  const token = await getGraphToken();
  if (!token) return null;
  try {
    const url = `https://graph.microsoft.com/v1.0/me/drive/root:/EAK-Sync/${encodeGraphPath(relativePath)}:/content`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) return null;
    return await res.blob();
  } catch (err) {
    console.warn('OneDrive photo download failed:', relativePath, err);
    return null;
  }
}

(async () => {
  try {
    await msalInstance.initialize();
    await msalInstance.handleRedirectPromise();
    const accounts = msalInstance.getAllAccounts();
    if (accounts.length > 0 && !msalInstance.getActiveAccount()) {
      msalInstance.setActiveAccount(accounts[0]);
    }
  } catch (err) {
    console.warn('OneDrive sign-in check failed:', err);
  }
  updateOneDriveUI();
})();

// ---- Proper CSV parser: handles quoted fields with embedded commas/quotes ----
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else { field += c; }
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || r[0] !== '');
}

const MASTER_CSV_PATH = 'pricing-csv/pricing-master.csv';
let allItems = [];
let brandsLoaded = false;

async function loadAllItems() {
  const result = await downloadOneDriveFileWithStatus(MASTER_CSV_PATH);
  if (result.status !== 'ok') {
    emptyStateEl.textContent = 'Could not reach the price book — check your connection.';
    return;
  }
  const rows = parseCSV(result.text);
  const header = rows[0].map(h => h.trim().toLowerCase());
  const idx = {
    barcode: header.indexOf('barcode'), size: header.indexOf('size'),
    price: header.indexOf('price'), qty: header.indexOf('qty'),
    brand: header.indexOf('brand'), notes: header.indexOf('notes'),
  };
  allItems = rows.slice(1)
    .filter(r => r[idx.barcode])
    .map(r => ({
      barcode: r[idx.barcode],
      size: idx.size > -1 ? r[idx.size] : '',
      price: idx.price > -1 ? r[idx.price] : '',
      qty: idx.qty > -1 ? r[idx.qty] : '',
      brand: idx.brand > -1 ? r[idx.brand] : '',
      notes: idx.notes > -1 ? r[idx.notes] : '',
    }));
  brandsLoaded = true;
  emptyStateEl.textContent = 'Start typing a brand above.';
}

// Same fraction-aware sort used by Price Check.
function parseSizeValue(sizeStr) {
  const s = (sizeStr || '').trim();
  const m = s.match(/^(\d+)(?:\s+(\d+)\/(\d+))?$/);
  if (!m) return null;
  const whole = parseInt(m[1], 10);
  if (m[2] && m[3]) return whole + parseInt(m[2], 10) / parseInt(m[3], 10);
  return whole;
}

let selectedBrand = null;
let selectedNotes = null;

function showSuggestions(box, matches, onPick) {
  box.innerHTML = '';
  if (matches.length === 0) {
    box.innerHTML = '<div class="suggestion-empty">No matches</div>';
    box.classList.add('show');
    return;
  }
  matches.slice(0, 8).forEach(m => {
    const item = document.createElement('div');
    item.className = 'suggestion-item';
    item.textContent = m;
    item.addEventListener('click', () => onPick(m));
    box.appendChild(item);
  });
  box.classList.add('show');
}

function hideSuggestions(box) {
  box.classList.remove('show');
  box.innerHTML = '';
}

brandInput.addEventListener('input', () => {
  selectedBrand = null;
  notesInput.value = '';
  notesInput.disabled = true;
  resultsEl.classList.remove('show');
  const q = brandInput.value.trim().toLowerCase();
  if (!q || !brandsLoaded) { hideSuggestions(brandSuggestions); return; }
  const uniqueBrands = [...new Set(allItems.map(i => i.brand).filter(Boolean))];
  const matches = uniqueBrands.filter(b => b.toLowerCase().includes(q)).sort();
  showSuggestions(brandSuggestions, matches, (picked) => {
    brandInput.value = picked;
    selectedBrand = picked;
    hideSuggestions(brandSuggestions);
    notesInput.disabled = false;
    notesInput.value = '';
    notesInput.placeholder = 'Start typing a style…';
    notesInput.focus();
  });
});

notesInput.addEventListener('input', () => {
  selectedNotes = null;
  resultsEl.classList.remove('show');
  if (!selectedBrand) { hideSuggestions(notesSuggestions); return; }
  const q = notesInput.value.trim().toLowerCase();
  const notesForBrand = [...new Set(
    allItems.filter(i => i.brand === selectedBrand).map(i => i.notes).filter(n => n !== undefined)
  )];
  const matches = (q ? notesForBrand.filter(n => n.toLowerCase().includes(q)) : notesForBrand).sort();
  if (!q) { hideSuggestions(notesSuggestions); return; }
  showSuggestions(notesSuggestions, matches, (picked) => {
    notesInput.value = picked;
    selectedNotes = picked;
    hideSuggestions(notesSuggestions);
    runSearch();
  });
});

document.addEventListener('click', (e) => {
  if (!brandInput.contains(e.target) && !brandSuggestions.contains(e.target)) hideSuggestions(brandSuggestions);
  if (!notesInput.contains(e.target) && !notesSuggestions.contains(e.target)) hideSuggestions(notesSuggestions);
});

photoLightbox.addEventListener('click', () => {
  photoLightbox.classList.remove('show');
  lightboxImg.src = '';
});

function renderPhotoThumb(name, url) {
  const wrap = document.createElement('div');
  wrap.className = 'photo-thumb';
  const img = document.createElement('img');
  img.src = url;
  img.alt = name;
  img.addEventListener('click', () => {
    lightboxImg.src = url;
    lightboxImg.alt = name;
    photoLightbox.classList.add('show');
  });
  wrap.appendChild(img);
  resultPhotos.appendChild(wrap);
}

// Same preference logic as Price Check — group by base shot name, prefer
// the -nobg version when one exists.
function pickPreferredPhotos(files) {
  const groups = new Map();
  files.forEach(f => {
    const m = f.name.match(/^(.*?)(-nobg)?\.[^.]+$/i);
    const base = m ? m[1] : f.name;
    const isNobg = !!(m && m[2]);
    if (!groups.has(base)) groups.set(base, {});
    const g = groups.get(base);
    if (isNobg) g.nobg = f; else g.original = f;
  });
  return [...groups.entries()]
    .sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }))
    .map(([, g]) => g.nobg || g.original)
    .filter(Boolean);
}

async function runSearch() {
  if (!selectedBrand || selectedNotes === null) return;

  const matches = allItems.filter(i => i.brand === selectedBrand && i.notes === selectedNotes);
  if (matches.length === 0) return;

  emptyStateEl.style.display = 'none';
  resultsEl.classList.add('show');
  resultBrand.textContent = selectedBrand;
  resultNotes.textContent = selectedNotes ? `"${selectedNotes}"` : '(no notes)';

  const sorted = [...matches].sort((a, b) => {
    const va = parseSizeValue(a.size), vb = parseSizeValue(b.size);
    if (va !== null && vb !== null) return va - vb;
    if (va !== null) return -1;
    if (vb !== null) return 1;
    return (a.size || '').localeCompare(b.size || '');
  });

  sizeListEl.innerHTML = '';
  sorted.forEach(item => {
    const row = document.createElement('div');
    row.className = 'size-row-display';
    const bc = document.createElement('span');
    bc.className = 'size-row-bc';
    bc.textContent = item.barcode;
    const size = document.createElement('span');
    size.className = 'size-row-size';
    size.textContent = item.size || '(no size)';
    const qty = document.createElement('span');
    qty.className = 'size-row-qty';
    qty.textContent = `Qty ${item.qty || '0'}`;
    row.append(bc, size, qty);
    sizeListEl.appendChild(row);
  });

  // Photos are shared across a whole style — check each matching barcode's
  // intake folder in order until one with actual photos turns up.
  resultPhotos.innerHTML = '';
  photosEmpty.style.display = 'none';
  let foundPhotos = false;
  for (const item of sorted) {
    const files = await listOneDriveFiles(`intake/${item.barcode}`);
    const imageFiles = (files || []).filter(f => /\.(jpe?g|png|webp|heic|heif)$/i.test(f.name));
    if (imageFiles.length === 0) continue;
    const preferred = pickPreferredPhotos(imageFiles);
    for (const f of preferred) {
      const blob = await downloadOneDriveFileBlob(`intake/${item.barcode}/${f.name}`);
      if (!blob) continue;
      renderPhotoThumb(f.name, URL.createObjectURL(blob));
      foundPhotos = true;
    }
    if (foundPhotos) break;
  }
  if (!foundPhotos) photosEmpty.style.display = 'block';
}
</script>
</body>
</html>
